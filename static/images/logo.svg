<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#74c69d" />
    </linearGradient>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="60" cy="60" r="54" fill="#d8f3dc" opacity="0.6"/>
  
  <!-- Left Leaf Curve -->
  <path d="M60 22 C35 32 24 58 32 82 C42 78 54 68 60 54" fill="url(#leafGrad)" />
  
  <!-- Right Leaf Curve -->
  <path d="M60 22 C85 32 96 58 88 82 C78 78 66 68 60 54" fill="url(#accentGrad)" />

  <!-- Central Stem / AI Circuit Spine -->
  <path d="M60 26 L60 96" stroke="#1b4332" stroke-width="3.5" stroke-linecap="round" />

  <!-- AI Circuit Branch 1 -->
  <path d="M60 48 L44 40" stroke="#1b4332" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="42" cy="39" r="4" fill="#2d6a4f" stroke="#ffffff" stroke-width="1.5"/>

  <!-- AI Circuit Branch 2 -->
  <path d="M60 62 L78 52" stroke="#1b4332" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="80" cy="51" r="4" fill="#52b788" stroke="#ffffff" stroke-width="1.5"/>

  <!-- AI Circuit Branch 3 -->
  <path d="M60 76 L46 72" stroke="#1b4332" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="44" cy="71" r="3.5" fill="#2d6a4f" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Top AI Node Spark -->
  <circle cx="60" cy="22" r="5" fill="#52b788" stroke="#ffffff" stroke-width="2"/>
</svg>
